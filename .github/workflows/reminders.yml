name: Kirim pengingat

# Dicek setiap 15 menit. Jam notifikasi pagi & malam diatur dari menu Pengaturan di aplikasi.
on:
  schedule:
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:
    inputs:
      jenis:
        description: 'auto = jalankan seperti jadwal biasa; lainnya = kirim tes sekarang'
        required: true
        default: auto
        type: choice
        options: [auto, pagi, malam, mingguan, tugas]

concurrency:
  group: pengingat
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/send-reminders.mjs ${{ inputs.jenis || 'auto' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
