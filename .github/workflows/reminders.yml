name: Kirim pengingat

on:
  schedule:
    - cron: '0 1 * * *'    # 08.00 WIB — 3 prioritas & kuota konten
    - cron: '0 16 * * *'   # 23.00 WIB — evaluasi harian
    - cron: '0 13 * * 0'   # Minggu 20.00 WIB — ringkasan mingguan
  workflow_dispatch:
    inputs:
      jenis:
        description: 'Jenis pengingat (untuk tes)'
        required: true
        default: pagi
        type: choice
        options: [pagi, malam, mingguan]

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tentukan jenis pengingat
        id: jenis
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.jenis }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 1 * * *")  echo "value=pagi" >> "$GITHUB_OUTPUT" ;;
              "0 16 * * *") echo "value=malam" >> "$GITHUB_OUTPUT" ;;
              "0 13 * * 0") echo "value=mingguan" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - run: node scripts/send-reminders.mjs ${{ steps.jenis.outputs.value }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
